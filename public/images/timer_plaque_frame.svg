<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 76" width="440" height="76" fill="none">
  <defs>
    <filter id="timerDropShadow" x="-5%" y="-15%" width="110%" height="140%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#8A5A36" flood-opacity="0.18" />
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#C8A270" flood-opacity="0.22" />
    </filter>
    <linearGradient id="parchmentBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFEFA" />
      <stop offset="50%" stop-color="#FBF6EE" />
      <stop offset="100%" stop-color="#F4ECE0" />
    </linearGradient>
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D8B684" />
      <stop offset="30%" stop-color="#B88D56" />
      <stop offset="50%" stop-color="#E2C69B" />
      <stop offset="70%" stop-color="#B58A53" />
      <stop offset="100%" stop-color="#CBA472" />
    </linearGradient>
  </defs>

  <!-- 1. Outer Cartouche Background with Drop Shadow -->
