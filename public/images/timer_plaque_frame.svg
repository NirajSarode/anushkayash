    <circle cx="9" cy="38" r="1.5" fill="#B88D56" />
    <path d="M 14 35 C 17 36.5 19 37.5 22 38 C 19 38.5 17 39.5 14 41" stroke-width="0.8" />

    <!-- Top Arabesque Scroll -->
    <path d="M 26 36 C 29 32 33 27 38 24 C 42 21 46 22 46 25 C 46 28 42 30 38 29 C 34 28 32 24 33 20 C 34 16 38 13 43 14" />
    <circle cx="40" cy="27" r="1" fill="#B88D56" />
    <circle cx="35" cy="18" r="0.9" fill="#B88D56" />

    <!-- Bottom Arabesque Scroll -->
    <path d="M 26 40 C 29 44 33 49 38 52 C 42 55 46 54 46 51 C 46 48 42 46 38 47 C 34 48 32 52 33 56 C 34 60 38 63 43 62" />
    <circle cx="40" cy="49" r="1" fill="#B88D56" />
    <circle cx="35" cy="58" r="0.9" fill="#B88D56" />

    <!-- Outer Decorative Pearl Beads on Cusps -->
    <circle cx="38" cy="38" r="1.2" fill="#B88D56" />
    <circle cx="49" cy="15" r="1" fill="#B88D56" />
    <circle cx="49" cy="61" r="1" fill="#B88D56" />
  </g>
